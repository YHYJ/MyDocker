#
# Description: CMS 后端服务

services:
  cms-backend:
    image: "ghcr.io/yhyj/cms-backend"
    container_name: "cms-backend"
    hostname: "cms-backend-docker"
    restart: "unless-stopped" # no, unless-stopped, always, on-failure:<max-retries>
    privileged: false
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
    networks:
      docker-network: {}
    environment:
      TZ: "Asia/Shanghai"
      DB_HOST: "postgres-plv8-dev"
      DB_PORT: "5432"
      DB_DATABASE: "cms"
      DB_USERNAME: "$DB_USERNAME"
      DB_PASSWORD: "$DB_PASSWORD"
    labels:
      servicename: "cms-backend"
    logging:
      driver: "json-file" # none, local, json-file(default), ...
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}/{{.ID}}/{{.ImageName}}/{{.ImageID}}"
        labels: "servicename"

networks:
  docker-network:
    name: "Docker-Network"
