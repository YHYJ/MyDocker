#
# Description: CMS 前端界面

services:
  cms-frontend:
    image: "ghcr.io/yhyj/cms-frontend"
    container_name: "cms-frontend"
    hostname: "cms-frontend-docker"
    restart: "unless-stopped" # no, unless-stopped, always, on-failure:<max-retries>
    privileged: false
    ports:
      - "127.0.0.1:8099:80"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
    networks:
      docker-network: {}
    environment:
      TZ: "Asia/Shanghai"
    labels:
      servicename: "cms-frontend"
    logging:
      driver: "json-file" # none, local, json-file(default), ...
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}/{{.ID}}/{{.ImageName}}/{{.ImageID}}"
        labels: "servicename"

networks:
  docker-network:
    name: "Docker-Network"
