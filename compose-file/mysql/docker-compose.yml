# Description: MySQL is a widely used, open-source relational database management system (RDBMS).

services:
  mysql:
    image: "mysql:5.7"
    container_name: "mysql"
    hostname: "mysql-docker"
    restart: "unless-stopped" # no, unless-stopped, always, on-failure:<max-retries>
    privileged: false
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
    networks:
      docker-network: {}
    environment:
      TZ: "Asia/Shanghai"
      MYSQL_DATABASE: "mysql"
      MYSQL_USER: "mysql"
      MYSQL_PASSWORD: "password4mysql"
      MYSQL_ROOT_PASSWORD: "rootpassword4mysql"
    labels:
      servicename: "mysql"
      com.centurylinklabs.watchtower.enable: false
    logging:
      driver: "json-file" # none, local, json-file(default), ...
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}/{{.ID}}/{{.ImageName}}/{{.ImageID}}"
        labels: "servicename"

volumes:
  mysql:
    name: "mysql"

networks:
  docker-network:
    name: "Docker-Network"

