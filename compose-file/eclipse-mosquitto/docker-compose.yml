# Description: Eclipse Mosquitto is an open source message broker which implements MQTT version 5, 3.1.1 and 3.1

services:
  eclipse-mosquitto:
    image: "eclipse-mosquitto"
    container_name: "eclipse-mosquitto"
    hostname: "eclipse-mosquitto-docker"
    restart: "unless-stopped" # no, unless-stopped, always, on-failure:<max-retries>
    privileged: false
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "$PWD/files/config/mosquitto.conf:/mosquitto/config/mosquitto.conf"
      - "$PWD/files/data:/mosquitto/data"
    networks:
      docker-network: {}
    environment:
      TZ: "Asia/Shanghai"
    labels:
      servicename: "eclipse-mosquitto"
      com.centurylinklabs.watchtower.enable: false
    logging:
      driver: "json-file" # none, local, json-file(default), ...
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.Name}}/{{.ID}}/{{.ImageName}}/{{.ImageID}}"
        labels: "servicename"

networks:
  docker-network:
    name: "Docker-Network"
